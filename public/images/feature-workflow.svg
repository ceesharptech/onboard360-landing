      <stop offset="0%" stop-color="#0e0f11" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>
    <pattern id="grid1" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg1)"/>
  <rect width="1600" height="1000" fill="url(#grid1)"/>

  <!-- Simulated Workflow Canvas -->

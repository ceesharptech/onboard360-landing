  <rect x="140" y="210" width="340" height="80" rx="8" fill="#202226" stroke="rgba(255, 255, 255, 0.08)"/>
  <rect x="140" y="310" width="340" height="80" rx="8" fill="#202226" stroke="rgba(255, 255, 255, 0.08)"/>
  <rect x="140" y="410" width="340" height="80" rx="8" fill="#202226" stroke="rgba(255, 255, 255, 0.08)"/>

  <rect x="540" y="140" width="380" height="720" rx="12" fill="#191a1c" stroke="rgba(255, 255, 255, 0.06)"/>
  <rect x="560" y="165" width="160" height="18" rx="4" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="560" y="210" width="340" height="80" rx="8" fill="#202226" stroke="rgba(255, 255, 255, 0.08)"/>
  <rect x="560" y="310" width="340" height="80" rx="8" fill="#202226" stroke="rgba(255, 255, 255, 0.08)"/>

  <rect x="960" y="140" width="520" height="720" rx="12" fill="#191a1c" stroke="rgba(255, 255, 255, 0.06)"/>

<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e10" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="400" fill="url(#glow)"/>

  <!-- Simulated App Header -->
  <rect x="0" y="0" width="1920" height="56" fill="#161719" fill-opacity="0.85"/>
  <line x1="0" y1="56" x2="1920" y2="56" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="36" cy="28" r="5" fill="rgba(255, 255, 255, 0.18)"/>
  <circle cx="54" cy="28" r="5" fill="rgba(255, 255, 255, 0.18)"/>
  <circle cx="72" cy="28" r="5" fill="rgba(255, 255, 255, 0.18)"/>

  <!-- Simulated Sidebar -->
  <rect x="0" y="56" width="280" height="1024" fill="#0f1011" fill-opacity="0.6"/>
  <line x1="280" y1="56" x2="280" y2="1080" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  
  <!-- Sidebar Skeleton Lines -->
  <rect x="32" y="96" width="120" height="14" rx="3" fill="rgba(255, 255, 255, 0.12)"/>
  <rect x="32" y="140" width="180" height="10" rx="3" fill="rgba(255, 255, 255, 0.06)"/>
  <rect x="32" y="170" width="150" height="10" rx="3" fill="rgba(255, 255, 255, 0.06)"/>
  <rect x="32" y="200" width="190" height="10" rx="3" fill="rgba(255, 255, 255, 0.06)"/>
  <rect x="32" y="230" width="140" height="10" rx="3" fill="rgba(255, 255, 255, 0.06)"/>

  <!-- Main Canvas Wireframe -->
  <rect x="330" y="100" width="320" height="26" rx="4" fill="rgba(255, 255, 255, 0.12)"/>
  <rect x="330" y="142" width="520" height="12" rx="3" fill="rgba(255, 255, 255, 0.06)"/>
  
  <!-- Kanban / Workflow Pipeline Cards Wireframe -->
  <rect x="330" y="190" width="360" height="790" rx="8" fill="#191a1c" fill-opacity="0.4" stroke="rgba(255, 255, 255, 0.07)"/>
  <rect x="720" y="190" width="360" height="790" rx="8" fill="#191a1c" fill-opacity="0.4" stroke="rgba(255, 255, 255, 0.07)"/>
  <rect x="1110" y="190" width="360" height="790" rx="8" fill="#191a1c" fill-opacity="0.4" stroke="rgba(255, 255, 255, 0.07)"/>
  <rect x="1500" y="190" width="380" height="790" rx="8" fill="#191a1c" fill-opacity="0.4" stroke="rgba(255, 255, 255, 0.07)"/>

  <!-- Center Focal Placeholder Badge -->
  <g transform="translate(960, 540)">
    <rect x="-240" y="-70" width="480" height="140" rx="12" fill="#08090a" fill-opacity="0.94" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <!-- Icon Symbol -->
    <rect x="-20" y="-48" width="40" height="28" rx="4" fill="none" stroke="#f7f8f8" stroke-width="2"/>
    <circle cx="-6" cy="-38" r="3" fill="#f7f8f8"/>
    <path d="M -16 -24 L -4 -32 L 6 -26 L 16 -34" stroke="#f7f8f8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Text -->
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f7f8f8" text-anchor="middle" letter-spacing="-0.02em">
      Onboard360 Product Screenshot Slot
    </text>
    <text x="0" y="32" font-family="ui-monospace, monospace" font-size="12" fill="#8a8f98" text-anchor="middle" letter-spacing="0.02em">
      16:9 Aspect Ratio // 1920 x 1080 (Drop real asset here)
    </text>
  </g>
</svg>

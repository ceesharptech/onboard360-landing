<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f11" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>
    <pattern id="grid3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg3)"/>
  <rect width="1600" height="1000" fill="url(#grid3)"/>

  <!-- Simulated AI Assistant / Qorra Chat & Document Grounding Canvas -->
  <rect x="60" y="60" width="1480" height="880" rx="16" fill="#161719" stroke="rgba(255, 255, 255, 0.08)"/>

  <!-- Left Sidebar: Verified Knowledge Sources -->
  <rect x="100" y="110" width="320" height="780" rx="10" fill="#191a1c" stroke="rgba(255, 255, 255, 0.06)"/>
  <rect x="130" y="140" width="140" height="16" rx="4" fill="rgba(255, 255, 255, 0.18)"/>
  
  <!-- Source items -->
  <rect x="130" y="180" width="260" height="48" rx="6" fill="#202226" stroke="rgba(255, 255, 255, 0.06)"/>
  <circle cx="154" cy="204" r="8" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="174" y="196" width="160" height="14" rx="3" fill="rgba(255, 255, 255, 0.15)"/>

  <rect x="130" y="240" width="260" height="48" rx="6" fill="#202226" stroke="rgba(255, 255, 255, 0.06)"/>
  <circle cx="154" cy="264" r="8" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="174" y="256" width="140" height="14" rx="3" fill="rgba(255, 255, 255, 0.15)"/>

  <rect x="130" y="300" width="260" height="48" rx="6" fill="#202226" stroke="rgba(255, 255, 255, 0.06)"/>
  <circle cx="154" cy="324" r="8" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="174" y="316" width="180" height="14" rx="3" fill="rgba(255, 255, 255, 0.15)"/>

  <!-- Right: Conversation Feed -->
  <rect x="450" y="110" width="1050" height="780" rx="10" fill="#191a1c" stroke="rgba(255, 255, 255, 0.06)"/>

  <!-- User Query Bubble -->
  <rect x="680" y="160" width="780" height="72" rx="10" fill="#23252a" stroke="rgba(255, 255, 255, 0.08)"/>
  <rect x="710" y="185" width="460" height="16" rx="4" fill="rgba(255, 255, 255, 0.25)"/>

  <!-- Qorra Grounded Response Bubble -->
  <rect x="490" y="260" width="860" height="200" rx="10" fill="#1d1e22" stroke="rgba(255, 255, 255, 0.08)"/>
  <!-- Sparkle avatar -->
  <circle cx="525" cy="295" r="14" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="560" y="285" width="120" height="14" rx="3" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="560" y="320" width="740" height="12" rx="3" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="560" y="344" width="680" height="12" rx="3" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="560" y="368" width="440" height="12" rx="3" fill="rgba(255, 255, 255, 0.15)"/>

  <!-- Source citation chips inside answer -->
  <rect x="560" y="405" width="200" height="28" rx="6" fill="#292b30" stroke="rgba(255, 255, 255, 0.12)"/>
  <rect x="770" y="405" width="180" height="28" rx="6" fill="#292b30" stroke="rgba(255, 255, 255, 0.12)"/>

  <!-- Prompt Input Bar at bottom -->
  <rect x="490" y="790" width="970" height="64" rx="12" fill="#141517" stroke="rgba(255, 255, 255, 0.1)"/>
  <rect x="520" y="814" width="340" height="16" rx="4" fill="rgba(255, 255, 255, 0.15)"/>
  <circle cx="1420" cy="822" r="18" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Centered Placeholder Badge -->
  <g transform="translate(800, 560)">
    <rect x="-240" y="-60" width="480" height="120" rx="12" fill="#08090a" fill-opacity="0.95" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f7f8f8" text-anchor="middle" letter-spacing="-0.02em">
      Qorra Assistant Screenshot Slot
    </text>
    <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" fill="#8a8f98" text-anchor="middle" letter-spacing="0.02em">
      16:10 Ratio // 1600 x 1000 (Drop UI screenshot here)
    </text>
  </g>
</svg>
